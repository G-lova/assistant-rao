stages:
  - deploy

manual_docker_deploy:
  stage: deploy
  tags:
    - lms-chatbot_native_runner
  script:
    - cd /prod/is_rao/assistant-rao
    # передаем токен авторизации прямо в URL
    - git pull https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.prostoy.ru/ai/assistant-rao.git master
    # Один образ assistant-rao:latest на все сервисы приложения (docker-compose.yml), с кэшем слоёв: пакеты
    # пересобираются только при изменении requirements.txt. Полная пересборка без кэша — переменная CI
    # NO_CACHE=1 при запуске задачи (например, чтобы обновить системные пакеты и сертификаты)
    - if [ "$NO_CACHE" = "1" ]; then docker compose build --no-cache; else docker compose build; fi
    # Тесты в собранном образе до перезапуска: при ошибке прод остаётся на прежней версии. Запуск через unittest —
    # pytest в образ не ставится. Пропустить — переменная CI SKIP_TESTS=1 при запуске задачи
    - if [ "$SKIP_TESTS" != "1" ]; then docker compose run --rm --no-deps rao_api python -m unittest discover -s tests -t . -q; fi
    # Пересоздаются только изменившиеся контейнеры (Postgres, Redis и pgAdmin не останавливаются);
    # воркеры Celery останавливаются тёпло (stop_grace_period в docker-compose.yml).
    # --remove-orphans удаляет контейнеры сервисов, которых больше нет в docker-compose.yml (сервис удалили или
    # переименовали): без флага такой контейнер продолжал бы работать со старым кодом — например, второй воркер
    # разбирал бы те же очереди
    - docker compose up -d --remove-orphans
  when: manual
  only:
    - master
