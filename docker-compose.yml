services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: rao_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - is_rao_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    # только с самого сервера (или через SSH-туннель): снаружи Postgres не открыт
    ports:
      - "127.0.0.1:2302:5432"
    networks:
      - rao_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # PgAdmin для управления PostgreSQL
  is-rao-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: is-rao-pgadmin
    restart: unless-stopped
    # только с самого сервера (или через SSH-туннель)
    ports:
      - "127.0.0.1:2303:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      TZ: ${TZ}
    volumes:
      - is-rao-pgadmin-data:/var/lib/pgadmin
      - is-rao-pgadminlogs:/var/log/pgadmin
      - /pgadmin_config.py:/pgadmin4/config_local.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rao_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--timeout=10",
          "--quiet",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  rao_api:
    # Образ собирается один раз (здесь) и используется всеми сервисами приложения: раньше build: . стоял у пяти
    # сервисов, и `docker compose build` собирал пять одинаковых образов
    build: .
    image: assistant-rao:latest
    env_file:
      - .env
    container_name: rao_api
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      API_URL: ${API_ACCESS}
      PYTHONPATH: /app
      UVICORN_TIMEOUT: 1200
      PYTHONUNBUFFERED: 1
      TZ: ${TZ}
    depends_on:
      - postgres
    ports:
      - "2300:20142"
    volumes:
      - .:/app
      - /tmp:/tmp
    command: uvicorn main:app --host 0.0.0.0 --port 20142 --timeout-keep-alive 1200 --timeout-graceful-shutdown 600 --reload
    restart: unless-stopped
    networks:
      - rao_network

  redis:
    image: redis:7-alpine
    container_name: rao_redis
    # ports:
    #   - "6379:6379"
    networks:
      - rao_network
    volumes:
      - is_rao_redis_data:/data
    restart: unless-stopped

  celery_worker:
    image: assistant-rao:latest   # образ собирает сервис rao_api
    pull_policy: never            # локальный образ, не искать в Docker Hub
    env_file:
      - .env
    container_name: rao_celery_worker
    volumes:
      - .:/app
      - /tmp:/tmp
    environment:
      - REDIS_URL=redis://rao_redis:6379/0
      - CELERY_BROKER_URL=redis://rao_redis:6379/0  # Добавьте это
      - CELERY_RESULT_BACKEND=redis://rao_redis:6379/0  # Добавьте это
      - TZ=${TZ}
      - API_KEY=${API_KEY}
    depends_on:
      - redis
    networks:
      - rao_network
    # Пул prefork: задачи очереди evaluation идут параллельно. Число процессов — configs/settings.py
    # (CELERY_EVAL_CONCURRENCY → celery_app.conf.worker_concurrency), поэтому --concurrency здесь не задан.
    # В пуле solo --concurrency не действовал: задачи шли строго по одной (синхронизация публикаций экспертов
    # задерживала /evaluate-documents), не работали пределы времени и перезапуск процесса по памяти/числу задач.
    command: celery -A celery_app worker -E --pool=prefork --loglevel=info -Q evaluation,parsing,scoring
    restart: unless-stopped
    # Тёплая остановка: воркер дожидается текущей задачи и возвращает в очередь неначатые (иначе через 10 с
    # Docker убивает его, и сообщение «зависает» до visibility_timeout — см. scripts/celery_unacked.py)
    stop_grace_period: 5m

  celery_worker_rm:
    image: assistant-rao:latest   # образ собирает сервис rao_api
    pull_policy: never            # локальный образ, не искать в Docker Hub
    env_file:
      - .env
    container_name: rao_celery_worker_rm
    volumes:
      - .:/app
      - /tmp:/tmp
    environment:
      - REDIS_URL=redis://rao_redis:6379/0
      - CELERY_BROKER_URL=redis://rao_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://rao_redis:6379/0
      - TZ=${TZ}
      - API_KEY=${API_KEY}
    depends_on:
      - redis
    networks:
      - rao_network
    # Риск-мониторинг: отдельная очередь, чтобы ночной анализ не блокировал /evaluate-documents
    command: celery -A celery_app worker -E --pool=prefork --concurrency=2 --loglevel=info -Q risk_monitoring -n rm@%h
    restart: unless-stopped
    # Тёплая остановка: воркер дожидается текущей задачи и возвращает в очередь неначатые (иначе через 10 с
    # Docker убивает его, и сообщение «зависает» до visibility_timeout — см. scripts/celery_unacked.py)
    stop_grace_period: 5m

  celery_beat:
    image: assistant-rao:latest   # образ собирает сервис rao_api
    pull_policy: never            # локальный образ, не искать в Docker Hub
    env_file:
      - .env
    container_name: rao_celery_beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - .:/app
      - /tmp:/tmp
    environment:
      - REDIS_URL=redis://rao_redis:6379/0
      - CELERY_BROKER_URL=redis://rao_redis:6379/0  # Добавьте это
      - CELERY_RESULT_BACKEND=redis://rao_redis:6379/0  # Добавьте это
      - TZ=${TZ}
      - API_KEY=${API_KEY}
    depends_on:
      - redis
    networks:
      - rao_network
    restart: unless-stopped

  flower:
    image: assistant-rao:latest   # образ собирает сервис rao_api
    pull_policy: never            # локальный образ, не искать в Docker Hub
    container_name: rao_flower
    command: celery -A celery_app flower --port=5555 --inspect-timeout=10000
    # Flower без пароля — только с самого сервера (или через SSH-туннель: ssh -L 5555:127.0.0.1:5555 сервер)
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - REDIS_URL=redis://rao_redis:6379/0
      - CELERY_BROKER_URL=redis://rao_redis:6379/0  # Добавьте это
      - CELERY_RESULT_BACKEND=redis://rao_redis:6379/0  # Добавьте это
      - TZ=${TZ}     
    depends_on:
      - redis
      - celery_worker
    networks:
      - rao_network
    restart: unless-stopped

networks:
  rao_network:
    external: false

volumes:
  is_rao_postgres_data:
  is_rao_redis_data:
  is-rao-pgadmin-data:
  is-rao-pgadminlogs: