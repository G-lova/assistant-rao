services:
  postgres:
    image: postgres:15-alpine
    container_name: rao_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    ports:
      - "2302:5432"
    networks:
      - qwen-vl-api_procurement_network
      - rao_network

  app:
    build: .
    container_name: rao_api
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      API_URL: ${API_ACCESS}
      PYTHONPATH: /app
    depends_on:
      - postgres
    ports:
      - "2300:20142"
    volumes:
      - .:/app
      - /tmp:/tmp
      - .env:/app/.env
    command: uvicorn main:app --host 0.0.0.0 --port 20142 --reload
    restart: unless-stopped
    networks:
      - qwen-vl-api_procurement_network
      - rao_network

  gradio:
    build: .
    container_name: rao_gradio
    ports:
      - "2301:20141"
    volumes:
      - .:/app
      - /tmp:/tmp
      - .env:/app/.env
    command: python -m watchfiles "python gradio_evaluator/gradio_app.py"
    restart: unless-stopped
    networks:
      - qwen-vl-api_procurement_network
      - rao_network
    depends_on:
      - app
    environment:
      API_URL: ${API_ACCESS}

  redis:
    image: redis:7-alpine
    container_name: rao_redis
    ports:
      - "6379:6379"
    networks:
      - rao_network
    volumes:
      - redis_data:/data

  celery_worker:
    build: .
    container_name: rao_celery_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - qwen-vl-api_procurement_network
      - rao_network
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: rao_celery_beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - rao_network
    restart: unless-stopped

  flower:
    build: .
    container_name: rao_flower
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - rao_network
    restart: unless-stopped

networks:
  qwen-vl-api_procurement_network:
    external: true
  rao_network:
    external: false

volumes:
  postgres_data:
  redis_data: