services:
  postgres:
    image: postgres:15-alpine
    container_name: procurement_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    ports:
      - "2302:5432"
    networks:
      - qwen-vl-api_procurement_network

  app:
    build: .
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      API_URL: ${API_ACCESS}
    depends_on:
      - postgres
    ports:
      - "2300:20142"
    volumes:
      - .:/app
      - /tmp:/tmp
      - .env:/app/.env
    command: uvicorn main:app --host 0.0.0.0 --port 20142 --reload
    restart: unless-stopped
    networks:
      - qwen_embedding_network
      - qwen-vl-api_procurement_network

  gradio:
    build: .
    ports:
      - "2301:20141"
    volumes:
      - .:/app
      - /tmp:/tmp
      - .env:/app/.env
    command: python -m watchfiles "python gradio_evaluator/gradio_app.py"
    restart: unless-stopped
    networks:
      - qwen-vl-api_procurement_network
    depends_on:
      - app
    environment:
      API_URL: ${API_ACCESS}

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: vector-qdrant
    restart: unless-stopped
    ports:
      - "2305:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - qwen_embedding_network
      - qwen-vl-api_procurement_network

  vector-api:
    build: .
    container_name: vector-api
    restart: unless-stopped
    ports:
      - "2306:8002"
    depends_on:
      - qdrant
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./search_engine:/app/search_engine
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    networks:
      - qwen_embedding_network
      - qwen-vl-api_procurement_network

networks:
  qwen-vl-api_procurement_network:
    external: true
  qwen_embedding_network:
    external: true

volumes:
  postgres_data:
  qdrant_data: